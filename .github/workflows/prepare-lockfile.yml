name: Prepare verified dependency lockfile

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budget-capture-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-lockfile:
    name: Resolve, verify and export package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 · Node 24
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 · Node 24
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # This workflow is intentionally separate from Pages deployment.
      # It resolves metadata only; it does not execute package lifecycle scripts.
      - name: Generate npm lockfile from exact package.json pins
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Enforce exact versions, approved HTTPS hosts and SHA-512 integrity
        run: npm run verify:lock

      - name: Create checksum and source metadata
        shell: bash
        run: |
          sha256sum package-lock.json | tee package-lock.sha256
          {
            echo "Source ref: ${GITHUB_REF}"
            echo "Source commit: ${GITHUB_SHA}"
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "Lockfile SHA-256: $(cut -d ' ' -f 1 package-lock.sha256)"
          } | tee package-lock-build-info.txt

      - name: Export verified lockfile artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 · Node 24
        with:
          name: budget-capture-verified-lockfile-${{ github.run_number }}
          path: |
            package-lock.json
            package-lock.sha256
            package-lock-build-info.txt
          if-no-files-found: error
          retention-days: 14
