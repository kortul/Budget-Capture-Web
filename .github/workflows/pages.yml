name: Validate and deploy Budget Capture Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budget-capture-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 · Node 24
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babce0c15c1 # v7.1.0 · Node 24
        with:
          node-version: 24

      - name: Verify committed dependency lockfile
        run: npm run verify:lock

      - name: Install locked browser dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium for real browser tests
        run: npx playwright install --with-deps chromium

      - name: Run source regression tests
        run: npm test

      - name: Build same-origin GitHub Pages assets
        run: npm run build:pages

      - name: Verify generated assets and SHA-256 manifest
        run: npm run test:dist

      - name: Run Chromium end-to-end tests
        run: npm run test:e2e

      - name: Export validated site for inspection
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 · Node 24
        with:
          name: budget-capture-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0 · Node 24 compatible
        with:
          path: dist

  deploy:
    name: Publish validated site to GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0 · Node 24

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1 · Node 24
